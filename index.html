    <script>
      (function () {
        try {
          var saved = localStorage.getItem("libsmart_darkmode");
          var isDark = saved !== null ? JSON.parse(saved) : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
